name: Build Nabu 4.14 ResuKISU-SusFS-KPM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make gcc libssl-dev bc flex bison libelf-dev zip wget unzip python3

      - name: Clone Xiaomi nabu 4.14 kernel source
        run: |
          git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b nabu-q-oss kernel
          cd kernel
          git submodule add https://github.com/5ec1cff/resukisu.git -b nongki kernel/resukisu
          git submodule add https://github.com/5ec1cff/Susfs4KernelSU.git -b nongki kernel/susfs
          git submodule add https://github.com/5ec1cff/KernelPatchModules.git -b nongki kernel/kpm
          git submodule update --init --recursive

      - name: Patch Makefile inject modules
        run: |
          cd kernel
          printf 'obj-$$(CONFIG_RESUKISU) += resukisu/\nobj-$$(CONFIG_SUSFS) += susfs/\nobj-$$(CONFIG_KPM) += kpm/\n' >> kernel/Makefile

      - name: Apply set_memory backport patch
        run: |
          cd kernel
          wget https://raw.githubusercontent.com/5ec1cff/KernelPatchModules/nongki/patches/4.14/set_memory_backport.patch
          git apply set_memory_backport.patch || true

      - name: Modify nabu_defconfig
        run: |
          cd kernel
          printf 'CONFIG_RESUKISU=y\nCONFIG_RESUKISU_MANUAL_HOOK=y\nRESUKISU_ALLOW_SYS_CALL=y\nRESUKISU_DEBUG=n\nCONFIG_SUSFS=y\nCONFIG_SUSFS_MANUAL_HOOK=y\nCONFIG_SUSFS_HIDE_KSU=y\nCONFIG_KPM=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_KALLSYMS_EXTRA_PASS=y\nCONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y\n' >> arch/arm64/configs/nabu_defconfig

      - name: Download clang-r383902 toolchain
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r37/clang-r383902.tar.gz -O clang.tar.gz
          mkdir toolchain
          tar xf clang.tar.gz -C toolchain
          echo "PATH=$PWD/toolchain/bin:$PATH" >> $GITHUB_ENV

      - name: Compile kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make nabu_defconfig
          make -j$(nproc) CC=clang LD=ld.lld

      - name: Install mkbootimg
        run: |
          wget https://github.com/osm0sis/mkbootimg/archive/refs/heads/master.zip -O mkboot.zip
          unzip mkboot.zip
          cd mkbootimg-master
          sudo python3 setup.py install

      - name: Pack boot.img
        run: |
          cd kernel
          mkbootimg \
            --kernel out/arch/arm64/boot/Image \
            --dtb out/arch/arm64/boot/dts/vendor/qcom/sm8150-nabu.dtb \
            --dtbo out/arch/arm64/boot/dtbo.img \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --dtb_offset 0x01f00000 \
            --tags_offset 0x00000100 \
            --pagesize 4096 \
            -o ../nabu-414-resukisu-susfs-kpm-boot.img

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabu-Custom-Boot
          path: nabu-414-resukisu-susfs-kpm-boot.img
